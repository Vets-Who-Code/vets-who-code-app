<link rel="stylesheet" href="../_brand.css" />
<style>
    .title { font-size: 34px; color: var(--navy); text-align: center; }
    .lede { font-weight: 500; font-size: 20px; color: #4a5568; margin-top: 10px; text-align: center; }
    .cols { display: flex; align-items: center; gap: 30px; flex: 1; width: 100%; }
    .side { flex: 1; display: flex; flex-direction: column; align-items: center; }
    .year {
        font-family: "GothamPro", sans-serif; font-weight: 900; font-size: 24px;
        letter-spacing: 0.06em; margin-bottom: 10px;
    }
    .caption { font-weight: 700; font-size: 18px; margin-top: 12px; text-align: center; line-height: 1.35; }
    .arrow { flex: none; text-align: center; width: 170px; }
    .arrow .label {
        font-family: "GothamPro", sans-serif; font-weight: 700; font-size: 16px;
        color: var(--navy); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 10px;
    }
    text { font-family: "Gilroy", sans-serif; }
</style>

<div class="artboard">
    <h1 class="title">AI ate the bottom layer</h1>
    <div class="lede">Execution got automated. Everything above it got more valuable.</div>

    <div class="cols">
        <div class="side">
            <div class="year" style="color: #7a8ba3">2021</div>
            <svg width="440" height="300" viewBox="0 0 440 300">
                <polygon points="220,4 280,96 160,96" fill="var(--gold)" />
                <polygon points="157,104 283,104 330,190 110,190" fill="#5b7fa8" />
                <polygon points="107,198 333,198 384,290 56,290" fill="#93aac4" />
                <text x="220" y="74" text-anchor="middle" font-size="18" font-weight="700" fill="var(--navy)">Judgment</text>
                <text x="220" y="140" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Mid-Level</text>
                <text x="220" y="166" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Execution</text>
                <text x="220" y="240" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">Routine Execution</text>
                <text x="220" y="267" text-anchor="middle" font-size="16" font-weight="500" fill="#f2f6fa">Boilerplate · Triage · First Drafts</text>
            </svg>
            <div class="caption" style="color: #4a5568">The junior entry point.</div>
        </div>

        <div class="arrow">
            <div class="label">AI Absorption</div>
            <svg width="170" height="52" viewBox="0 0 170 52">
                <path d="M0 15 H114 V0 L170 26 L114 52 V37 H0 Z" fill="var(--gold)" />
            </svg>
        </div>

        <div class="side">
            <div class="year" style="color: var(--navy)">2026</div>
            <svg width="440" height="300" viewBox="0 0 440 300">
                <polygon points="220,6 392,256 48,256" fill="var(--navy)" stroke="var(--gold)" stroke-width="5" />
                <rect x="48" y="264" width="344" height="28" rx="4" fill="#8d99a8" />
                <text x="220" y="186" text-anchor="middle" font-size="23" font-weight="700" fill="var(--gold)">The Judgment Layer</text>
                <text x="220" y="214" text-anchor="middle" font-size="16" font-weight="500" fill="#dce6f2">Verify it. Own it. Explain it.</text>
                <text x="220" y="238" text-anchor="middle" font-size="16" font-weight="500" fill="#dce6f2">Know when not to ship it.</text>
                <text x="220" y="284" text-anchor="middle" font-size="16" font-weight="700" fill="var(--navy)">AI AUTOMATION</text>
            </svg>
            <div class="caption" style="color: var(--navy)">The entry-level floor is gone.<br />The premium is on owning the output.</div>
        </div>
    </div>

    <div class="footer">
        <span>Tool fluency is table stakes. Judgment is the premium.</span>
        <span class="brand">Vets Who Code</span>
    </div>
</div>
