<link rel="stylesheet" href="../_brand.css" />
<style>
    .artboard h1 {
        font-size: 68px;
        color: var(--navy-midnight);
        margin-bottom: 48px;
        line-height: 1.1;
    }

    .highlight {
        color: var(--navy-ocean);
    }

    .content {
        display: flex;
        flex: 1;
        gap: 72px;
        width: 100%;
    }

    .left-col {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 56px;
        border-right: 3px solid var(--navy-sky);
        padding-right: 48px;
    }

    .right-col {
        flex: 1.1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 40px;
    }

    .win-row {
        display: flex;
        align-items: center;
        gap: 32px;
    }

    .win-num {
        font-family: "GothamPro", system-ui, sans-serif;
        font-size: 88px;
        font-weight: 900;
        color: var(--navy-ocean);
        width: 72px;
        text-align: center;
        line-height: 0.8;
        letter-spacing: -0.02em;
    }

    .win-row.zero .win-num {
        color: var(--red);
    }

    .win-text {
        font-size: 26px;
        font-weight: 700;
        color: var(--navy-midnight);
        line-height: 1.3;
    }

    .win-sub {
        font-family: "Gilroy", system-ui, sans-serif;
        font-size: 22px;
        font-weight: 500;
        color: var(--navy-deep);
        display: block;
        margin-top: 4px;
    }

    .section-title {
        font-family: "GothamPro", system-ui, sans-serif;
        font-size: 32px;
        font-weight: 900;
        color: var(--navy-midnight);
        text-transform: uppercase;
        letter-spacing: -0.01em;
        margin-bottom: 8px;
    }

    .bar-chart {
        display: flex;
        flex-direction: column;
        gap: 36px;
    }

    .bar-row {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .bar-label-text {
        font-family: "Gilroy", system-ui, sans-serif;
        font-size: 24px;
        font-weight: 700;
        color: var(--navy-midnight);
    }

    .bar-graphic {
        display: flex;
        align-items: center;
        gap: 20px;
    }

    .bar-track {
        flex: 1;
        height: 48px;
        background: var(--navy-sky);
        border-radius: 6px;
        display: flex;
        align-items: center;
    }

    .bar-fill {
        height: 100%;
        border-radius: 6px;
    }

    .fill-cold {
        width: 1.5%;
        background: var(--red);
    }

    .fill-ref {
        width: 60%; /* Represents 30% on a 50% max scale */
        background: var(--navy-ocean);
    }

    .fill-rec {
        width: 80%; /* Represents 40% on a 50% max scale */
        background: var(--gold);
    }

    .bar-value {
        font-family: "GothamPro", system-ui, sans-serif;
        font-weight: 900;
        font-size: 26px;
        color: var(--navy-midnight);
        width: 90px;
    }
</style>

<div class="artboard">
    <h1>79 Applications. <span class="highlight">4 Wins.</span></h1>
    
    <div class="content">
        <div class="left-col">
            <div class="win-row">
                <div class="win-num">2</div>
                <div class="win-text">
                    Full-time offers
                    <span class="win-sub">via inbound recruiters</span>
                </div>
            </div>
            
            <div class="win-row">
                <div class="win-num">2</div>
                <div class="win-text">
                    Contract roles
                    <span class="win-sub">via network</span>
                </div>
            </div>
            
            <div class="win-row zero">
                <div class="win-num">0</div>
                <div class="win-text">
                    Wins
                    <span class="win-sub">from cold applications alone</span>
                </div>
            </div>
        </div>

        <div class="right-col">
            <div class="section-title">Conversion Rates</div>
            
            <div class="bar-chart">
                <div class="bar-row">
                    <div class="bar-label-text">Cold Applications</div>
                    <div class="bar-graphic">
                        <div class="bar-track">
                            <div class="bar-fill fill-cold"></div>
                        </div>
                        <div class="bar-value" style="color: var(--red)">&lt; 1%</div>
                    </div>
                </div>

                <div class="bar-row">
                    <div class="bar-label-text">Referrals</div>
                    <div class="bar-graphic">
                        <div class="bar-track">
                            <div class="bar-fill fill-ref"></div>
                        </div>
                        <div class="bar-value">~ 30%</div>
                    </div>
                </div>

                <div class="bar-row">
                    <div class="bar-label-text">Recruiter Conversations</div>
                    <div class="bar-graphic">
                        <div class="bar-track">
                            <div class="bar-fill fill-rec"></div>
                        </div>
                        <div class="bar-value">~ 40%</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="footer">
        <span>Inbound comes from years of building in public.</span>
        <span class="brand">Vets Who Code</span>
    </div>
</div>
